version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示算例 07: 自定义插件挂载与物理语义总线扩展流水线 (Custom Plugin Pipeline)
# 
# 算例定位:
# - 演示在 Schema 2.0 DSL 中挂载外部用户自定义 Python 后处理插件，并通过物理语义总线扩展业务逻辑
# 
# 核心特征 / 演示重点:
# - 任务模式: task.type = "sweep"，外层参数扫描与增量插件扩展
# - 插件声明: 在 plugins.postprocess 中声明外部脚本与类名，支持显式传参 (Explicit-First)
# - 语义解耦: 插件内部通过 Physics Semantic Bus 自动适配 Modelica 多态列名与物料代号
# - 依赖拓扑: Kahn DAG Auto-Ordering 算法自动分析执行顺序，确保与内置存储器无缝协同
# - 业务场景: 在役储罐安全谷底红线审计 (baseline: 6100g, safety_valley_redline: 1000g)
# - 交付报告: 聚变堆自定义插件扩展与在役储罐安全裕度评估报告 (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "second"
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|sds.I[1]|blanket.I[1]|wds.I[1]|tep_fep.I[1]"

task:
  type: "sweep"
  parallel: true
  max_workers: 8
  parameters:
    - name: "Conservative_LowBurnup_TBR_1.10"
      blanket.TBR: 1.10
      plasma.fb: 0.03
    - name: "High_Breeding_Nominal_TBR_1.18"
      blanket.TBR: 1.18
      plasma.fb: 0.06
  metrics:
    peak_inventory:
      source: "sds.I[1]"
      evaluate: "peak_value"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"

# 🌟 增量插件挂载: 声明外部插件脚本路径与显式传参
plugins:
  postprocess:
    - name: "tritium_reserve_auditor"
      script: "plugins/tritium_reserve_auditor.py"
      class: "TritiumReserveAuditorPlugin"
      params:
        baseline_loading_g: 6100.0
        safety_valley_redline_g: 1000.0

visualizer:
  enabled: true
  launch_on_finish: true
  report:
    enabled: true
    title: "TRICYS 聚变堆自定义插件扩展与在役储罐安全裕度评估报告"
    formats: ["markdown", "docx", "pdf"]
