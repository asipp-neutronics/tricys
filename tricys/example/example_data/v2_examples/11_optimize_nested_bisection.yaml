version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示算例 11: 双层嵌套二分优化 (Nested Bisection for Startup Inventory & Required TBR)
# 
# 算例定位:
# - 工业级全厂闭环模型 (example_model.Cycle) 核心自持指标双层寻优，严格满足谷底储备与翻倍时间双约束
# 
# 核心特征 / 演示重点:
# - 任务模式: task.type = "optimize", algorithm = "nested_bisection" (Track 2)
# - 外层寻优: 优化初始装填量 (sds.I_S_0: [1000g, 5000g])，确保储存谷底不低于安全红线 (min_value >= 1000g)
# - 内层寻优: 优化临界产氚比 (blanket.TBR: [1.05, 1.25])，确保自持翻倍时间达标 (doubling_time <= 2500h)
# - 极速内核: 自动化传递 variableFilter 约束 OMC 结果矩阵体积，实现单次全流程优化数十秒极速收敛
# - 交付报告: 寻优收敛评估与全厂物料平衡分析报告 (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "hour"
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|sds.I[1]|blanket.I[1]|blanket.TBR|wds.I[1]"

task:
  type: "optimize"
  track: "track2_bisection"
  algorithm: "nested_bisection"
  parallel: false
  parameters:
    plasma.fb: 0.05
  optimization:
    track: "track2_bisection"
    outer:
      parameter: "sds.I_S_0"
      search_bounds: [1000.0, 5000.0]
      tolerance: 20.0
      max_iterations: 10
      target_metric:
        source: "sds.I[1]"
        evaluate: "min_value"
        threshold: 1000.0
        comparator: ">="
    inner:
      parameter: "blanket.TBR"
      metric_name: "Required_TBR"
      search_bounds: [1.05, 1.25]
      tolerance: 0.005
      max_iterations: 10
      target_metric:
        source: "sds.I[1]"
        evaluate: "doubling_time"
        threshold: 2500.0
        comparator: "<="

visualizer:
  enabled: true
  launch_on_finish: true
  report:
    enabled: true
    title: "TRICYS 双层嵌套二分优化 (自持启动库存与 TBR 协同求解报告)"
    formats: ["markdown"]
