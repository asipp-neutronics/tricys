version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示算例 01: 多工况参数扫描与氚自持评估 (Sweep Startup Self-Sufficiency)
# 
# 算例定位:
# - 聚变堆氚燃料循环经典多工况参数扫描，评估不同燃烧份额与产氚能力下的全厂氚自持边界
# 
# 核心特征 / 演示重点:
# - 任务模式: task.type = "sweep"，并行参数扫描 (多进程加速)
# - 物理参数: 耦合扫描燃烧分数 (plasma.fb: 3%~8%) 与产氚比 (blanket.TBR: 1.08~1.22)
# - 关键指标: 求解峰值库存 (peak_inventory)、最终库存 (final_inventory) 与自持启动装填量 (startup_inventory)
# - 交付报告: 自动导出多工况横向对比工程分析报告 (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "second"
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|sds.I[1]|blanket.I[1]|wds.I[1]|tep_fep.I[1]|i_iss.I[1]"

task:
  type: "sweep"
  parallel: true
  max_workers: 8
  parameters:
    - name: "Case_1_Direct_DT_Baseline"
      blanket.TBR: 1.10
      plasma.fb: 0.05
    - name: "Case_2_LowBurnup_Conservative"
      blanket.TBR: 1.08
      plasma.fb: 0.03
    - name: "Case_3_Advanced_High_Breeding"
      blanket.TBR: 1.22
      plasma.fb: 0.08
  metrics:
    peak_inventory:
      source: "sds.I[1]"
      evaluate: "peak_value"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"
    startup_inventory:
      source: "sds.I[1]"
      evaluate: "startup_inventory"

visualizer:
  enabled: true
  launch_on_finish: true
  report:
    enabled: true
    # template: "sweep"  # 默认不填自动与 task.type ("sweep") 保持一致
    title: "TRICYS 聚变堆多工况参数扫描与氚自持评估工程报告"
    formats: ["markdown", "docx", "pdf"]
