version: "2.0"

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|sds.I[1]|blanket.I[1]|wds.I[1]|tep_fep.I[1]|i_iss.I[1]"

task:
  type: "simulate"
  parallel: true
  parameters:
    blanket.TBR: 1.12
    wds.threshold: 1000.0
  metrics:
    peak_inventory:
      source: "sds.I[1]"
      evaluate: "peak_value"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"
    Required_TBR:
      evaluate: "bisection_search"
      parameter: "blanket.TBR"
      search_bounds: [1.0, 1.4]
      tolerance: 0.001
      max_iterations: 15
      target_metric:
        source: "sds.I[1]"
        evaluate: "doubling_time"
        threshold: 63072000.0  # 2年（秒: 2 * 365 * 86400 s）; 若模型单位为年则填 2.0
        
report:
  enabled: true
  # template: "simulate"  # 默认不填自动与 task.type ("simulate") 保持一致
  title: "TRICYS 单堆瞬态脉冲响应与全系统质量平衡审查报告"
  formats: ["markdown", "docx", "pdf"]

visualizer:
  enabled: true
  launch_on_finish: true
