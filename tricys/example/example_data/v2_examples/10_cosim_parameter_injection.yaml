version: "2.0"

# ==============================================================================
# TRICYS 工业基准算例 10: Schema 2.0 协同仿真 —— 参数注入模式 (Parameter Injection)
# 
# 模式特征:
# - 基于 Wang (2022) CFETR 聚变堆同位素分离系统 (ISS-I & ISS-O) 真实配置
# - 任务级统一注入: injection_type: "handler"
# - 独立案例资产: 集中组织于 ./10_cosim_parameter_injection/ 独立文件夹中
# - 强拓扑兼容性校验: 在子组件替换前由 submodel_replacer 严格校验上下游端口因果性、维度与 Connection 拓扑
# - 极速长周期仿真: OpenModelica 原生 -overrideFile 注入稳态解，免去多塔严密偏微分方程长时间积分
# ==============================================================================

model:
  fileName: "./10_cosim_parameter_injection/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "hour"
  stopTime: 5000.0
  stepSize: 1.0
  method: "dassl"
  variableFilter: "time|sds.I[1]|blanket.I[1]|wds.I[1]|i_iss.to_SDS[1]|o_iss.to_SDS[1]"

task:
  type: "cosim"
  mode: "parameter_injection"
  injection_type: "handler"                                # 统一注入方式: "file" 或 "handler"
  override_file: "./10_cosim_parameter_injection/override_cycle.txt" # 注入覆盖参数目标文件
  handler_script: "./10_cosim_parameter_injection/run_h2iso_wang2022.py" # 任务级外部求解脚本
  handler_params:
    wang2022_config_issi: "./10_cosim_parameter_injection/wang2022_issi.json"
    wang2022_config_isso: "./10_cosim_parameter_injection/wang2022_isso.json"
    solve_mode: "live"
    method: "wegstein"
    max_iter: 10
    tol: 0.01
    continuation_substeps: 2
  subsystems:
    - target: "example_model.I_ISS"
      instance: "i_iss"
      solver: "h2iso"
      substitute_model: "Generic_ISS_Adapters.ISS_I_Adapter"
      substitute_file: "./10_cosim_parameter_injection/Generic_ISS_Adapters.mo"
      aux_files:
        - "./10_cosim_parameter_injection/Generic_ISS.mo"
    - target: "example_model.O_ISS"
      instance: "o_iss"
      solver: "h2iso"
      substitute_model: "Generic_ISS_Adapters.ISS_O_Adapter"
      substitute_file: "./10_cosim_parameter_injection/Generic_ISS_Adapters.mo"
      aux_files:
        - "./10_cosim_parameter_injection/Generic_ISS.mo"
  metrics:
    peak_inventory:
      source: "sds.I[1]"
      evaluate: "peak_value"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"

visualizer:
  enabled: true
  launch_on_finish: false
  report:
    enabled: true
    title: "TRICYS 聚变堆多物理场协同仿真报告 (基于 Wang 2022 真实求解的参数注入)"
    formats: ["markdown", "docx", "pdf"]
