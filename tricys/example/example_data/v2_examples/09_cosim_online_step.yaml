version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示算例 09: 协同仿真 —— FESTIM 偏滤器材料微观有限元在线步进双向同步
# 
# 算例定位:
# - 基于 SSP/FMI 与动态锁步 (Lockstep) 协议，耦合开源有限元迁移框架 FESTIM 2.0 与全厂宏观模型
# 
# 核心特征 / 演示重点:
# - 协同模式: task.type = "cosim", mode = "online_step"
# - 时间尺度: scenario.time_base = "hour" (支持 100.0 h 长周期物理平衡与捕获饱和演化)
# - 多速率协同: time_scale_coordination (mode: "runtime_coordinated", 宏观步长 0.01 h = 36 s, 微观组件步长 0.00555 h ≈ 20 s)
# - 求解引擎: Tier 1 进程内直接 FEM (MonoblockFEMModel) · DOLFINx 有限元求解 · 零 Socket 损耗 · 高精度
# - 微观物理: 解析偏滤器多层异质铠装 (W/Cu/CuCrZr) 中单空位缺陷捕获饱和与渗透时滞
# - 宏观反馈: 材料吸氢“海绵效应”对冷却水回路与全厂储罐 (SDS) 动态供料安全的真实约束
# - 质量闭环: 挂载 OnlineGlobalAuditor 实时进行微观-宏观跨尺度质量守恒审计
# ==============================================================================

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "hour"
  startTime: 0.0
  stopTime: 100.0
  stepSize: 0.01
  variableFilter: "time|sds.I[1]|div.I[1]|coolant_pipe.I[1]|plasma.I[1]|blanket.I[1]"

task:
  type: "cosim"
  mode: "online_step"
  auditor:
    enabled: true
    warn_threshold_g: 50.0
    kill_threshold_g: 1000.0
  subsystems:
    - target: "example_model.DIV"
      instance: "div"
      solver: "festim"
      handler_script_path: "./09_cosim_online_step/festim_div_processor.py"
      handler_function: "FESTIMDivertorProcessor"
      params:
        area_m2: 140.0
        T_K: 600.0
        decay_const_per_h: 6.4e-6
      time_scale_coordination:
        mode: "runtime_coordinated"
        component_step_size_h: 0.00555
  metrics:
    peak_inventory:
      source: "sds.I[1]"
      evaluate: "peak_value"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"

visualizer:
  enabled: true
  launch_on_finish: false
  report:
    enabled: true
    title: "TRICYS-FESTIM 偏滤器材料输运微观有限元在线步进多速率协同仿真评估报告"
    formats: ["markdown", "docx", "pdf"]
