version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示算例 04: 脉冲占空比扫描与 Required TBR 耦合评估 (Pulse Width Sweep with Bisection)
# 
# 算例定位:
# - 针对不同电厂运行占空比/脉冲宽度工况，评估其对满足自持翻倍时间临界产氚比的抬升规律
# 
# 核心特征 / 演示重点:
# - 任务模式: task.type = "sweep"，外层扫描脉冲宽度，指标内嵌单层二分搜索
# - 物理参数: 扫描脉冲宽度 (pulseSource.width: 100h / 80h / 60h，对应连续运行与变占空比脉冲工况)
# - 关键指标: 启动库存亏空、最终库存，以及满足 2 年自持倍增时间 (doubling_time <= 1500h) 的 Required TBR
# - 交付报告: 脉冲占空比变工况自持启动亏空与临界产氚比分析报告 (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "second"
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|sds.I[1]|blanket.I[1]|wds.I[1]|tep_fep.I[1]|i_iss.I[1]"

task:
  type: "sweep"
  parallel: true
  max_workers: 8
  parameters:
    - name: "Width_100_Continuous"
      pulseSource.width: 100.0
    - name: "Width_80_Pulsed"
      pulseSource.width: 80.0
    - name: "Width_60_Pulsed"
      pulseSource.width: 60.0
  metrics:
    startup_inventory:
      source: "sds.I[1]"
      evaluate: "startup_inventory"
      unit: "g"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"
      unit: "g"
    Required_TBR:
      evaluate: "bisection_search"
      parameter: "blanket.TBR"
      search_bounds: [1.0, 1.5]
      tolerance: 0.001
      max_iterations: 15
      target_metric:
        source: "sds.I[1]"
        evaluate: "doubling_time"
        threshold: 1500.0  # 2年自持倍增时间约束阈值

visualizer:
  enabled: true
  launch_on_finish: true
  report:
    enabled: true
    # template: "sweep"  # 默认不填自动与 task.type ("sweep") 保持一致
    title: "TRICYS 脉冲占空比变工况自持启动亏空与临界产氚比分析报告"
    formats: ["markdown", "docx", "pdf"]
