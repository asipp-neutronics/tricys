version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示算例 06: 全系统物理语义质量守恒闭环离线审计 (Mass Conservation Audit)
# 
# 算例定位:
# - 在长周期动态仿真后，自动挂载物理守恒审计器，对全厂产氚、滞留、泄漏、衰变、燃烧进行闭环质量校验
# 
# 核心特征 / 演示重点:
# - 任务模式: task.type = "simulate"，内嵌 task.auditor 审计系统
# - 审计机制: 自动抓取通配符变量 (*.I, *.cumulative_breed, *.leak_rate, *.decay_rate, *.cumulative_burn)
# - 守恒判据: 严格基于全厂质量连续性方程进行代数和校验，设警告阈值 (warn: 0.5g) 与熔断阈值 (kill: 50.0g)
# - 交付报告: 全厂动态物料平衡与闭环质量守恒审计工况报告 (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "../example_model_single/example_model.mo"
  modelName: "example_model.Cycle"

scenario:
  time_base: "second"
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|.*\\.I.*|.*\\.cumulative_.*|.*_rate.*"

task:
  type: "simulate"
  parallel: true
  parameters:
    blanket.TBR: 1.10
    plasma.fb: 0.05
  metrics:
    peak_inventory:
      source: "sds.I[1]"
      evaluate: "peak_value"
    final_inventory:
      source: "sds.I[1]"
      evaluate: "final_value"
  auditor:
    enabled: true
    patterns:
      inventory:
        - "*.I?1?"
      cumulative_sources:
        - "*blanket.cumulative_breed?1?"
      leak:
        - "*.leak_rate?1?"
      decay:
        - "*.decay_rate?1?"
      cumulative_burn:
        - "*plasma.cumulative_burn?1?"

visualizer:
  enabled: true
  launch_on_finish: true
  report:
    enabled: true
    title: "TRICYS 全厂动态物料平衡与闭环质量守恒审计工况报告"
    formats: ["markdown", "docx", "pdf"]
