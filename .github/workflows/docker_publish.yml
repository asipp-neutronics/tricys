name: Build & Publish TRICYS Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - V2.0
    paths:
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'README_zh.md'
      - 'script/modelica_install/**'
      - 'tricys/**'
      - 'tricys_backend'
      - 'tricys_backend/**'
      - 'tricys_visual'
      - 'tricys_visual/**'
      - 'tricys_goview'
      - 'tricys_goview/**'
      - '.gitmodules'
      - '.github/workflows/docker_publish.yml'

env:
  TRICYS_IMAGE: ghcr.io/${{ github.repository_owner }}/tricys
  TRICYS_GOVIEW_BRANCH: main

jobs:
  build-and-push:
    name: Publish Unified TRICYS Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync tricys_goview branch
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git -C tricys_goview fetch origin ${TRICYS_GOVIEW_BRANCH}
          if git -C tricys_goview rev-parse --verify ${TRICYS_GOVIEW_BRANCH} >/dev/null 2>&1; then
            git -C tricys_goview checkout ${TRICYS_GOVIEW_BRANCH}
          else
            git -C tricys_goview checkout -b ${TRICYS_GOVIEW_BRANCH} --track origin/${TRICYS_GOVIEW_BRANCH}
          fi
          git -C tricys_goview pull --ff-only origin ${TRICYS_GOVIEW_BRANCH}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TRICYS_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push unified TRICYS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfiles/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api/v1
            VITE_API_V2_URL=/api/v2/goview
            VITE_GOVIEW_URL=/goview/
            VITE_PRO_PATH=
          cache-from: type=gha,scope=tricys-unified
          cache-to: type=gha,mode=max,scope=tricys-unified