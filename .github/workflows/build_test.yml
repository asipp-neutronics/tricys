name: TRICYS V2 CI & Validation

on:
  push:
    branches: [ main, develop, V2.0 ]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  core-regression-and-dag:
    name: 1. Core Unit Tests & V2 Examples DAG Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest
          pip install -e . --no-deps

      - name: Run 42 Regression & Unit Tests (build_test)
        run: |
          pytest -v -m build_test test

      - name: Validate & Compile All 12 V2 Industrial Examples
        run: |
          pytest test/test_example_runner.py -v

  container-physics-simulation:
    name: 2. Container Multi-Physics Environment Validation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asipp-neutronics/tricys:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure workspace permissions
        run: |
          chown -R appuser:appuser /__w/tricys/tricys

      - name: Verify V2 Example Runner Discovery & CLI
        run: |
          python3 -m tricys.example.example_runner.runner --list

      - name: Validate & Compile V2 Examples DAG in Container
        run: |
          python3 -m tricys.example.example_runner.runner --validate 1
          python3 -m tricys.example.example_runner.runner --compile 1
          python3 -m tricys.example.example_runner.runner --validate 2
          python3 -m tricys.example.example_runner.runner --compile 2

      - name: Verify All 12 V2 Examples in Container
        run: |
          pytest test/test_example_runner.py -v

      - name: Run Live V2 Example Simulation in Container
        run: |
          python3 -m tricys.example.example_runner.runner --run 1 --no-vis
