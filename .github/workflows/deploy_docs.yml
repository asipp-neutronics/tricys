name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - pages

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pymdown-extensions is pinned on purpose: 13.x changed
          # `pymdownx.highlight.Highlight.__init__` to require a positional `md`
          # argument, which mkdocstrings 0.30.1 does not pass, and the deploy died
          # with `TypeError: Highlight.__init__() missing 1 required positional
          # argument: 'md'`. 10.16.1 is the newest release with the old signature.
          pip install mkdocs==1.6.1 \
                      mkdocs-material==9.7.0 \
                      mkdocs-static-i18n==1.3.0 \
                      mkdocstrings==0.30.1 \
                      mkdocstrings-python==1.19.0 \
                      mkdocs-mermaid2-plugin==1.2.3 \
                      pymdown-extensions==10.16.1

      - name: Deploy
        run: mkdocs gh-deploy --force --clean --strict
