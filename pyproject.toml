[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tricys"
version = "2.0.0"
authors = [
  { name="asipp-neutronics", email="guilong@ie.ah.cn" },
]
description = "TRitium Integrated CYcle Simulation"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "OMPython >= 4.0.0",
    "OMSimulator",
    "fmpy",
    "openai",
    "python-dotenv",
    "SALib",
    "python-json-logger",
    "tabulate",
    "tables",
    "dash==3.3.0",
    "dash-bootstrap-components==2.0.4",
    "plotly==6.5.0",
    "pywin32; sys_platform == 'win32'",
    "pyyaml",
    "pydantic",
    "scipy",
    "python-docx",
    "pymupdf",
    "markdown"
]

[project.urls]
"Homepage" = "https://github.com/asipp-neutronics/tricys"
"Bug Tracker" = "https://github.com/asipp-neutronics/tricys"

[project.scripts]
tricys = "tricys.main:main"


[project.optional-dependencies]
dev = [
    "pytest",  
    "ruff",    
    "black",
    "pre-commit"
]

docs = [
    "mkdocs",
    "mkdocs-autorefs",
    "mkdocs-get-deps",
    "mkdocs-material",
    "mkdocs-material-extensions",
    "mkdocs-mermaid2-plugin",
    "mkdocs-static-i18n",
    "mkdocstrings",
    "mkdocstrings-python"
]

[tool.setuptools]
packages = [
    "tricys_backend",
    "tricys",
    "tricys.workflow",
    "tricys.preprocessing",
    "tricys.simulation",
    "tricys.simulation.engines",
    "tricys.utils",
    "tricys.core",
    "tricys.analysis",
    "tricys.plugins",
    "tricys.plugins.auditor",
    "tricys.example",
    "tricys.example.example_runner",
    "tricys.visualizer",
    "tricys.visualizer.report",
    "tricys.online_cosim",
]

[tool.setuptools.package-data]
tricys = ["example/example_data/**/*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501","E722"]

[tool.ruff.lint.isort]
known-first-party = ["tricys"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--ignore=test/visualizer/test_web_visualizer_cases.py"
markers = [
    "build_test: marks tests for github action",
    "slow: marks tests that take longer to run (e.g. real Modelica simulations)",
]
