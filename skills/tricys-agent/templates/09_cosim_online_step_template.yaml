version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示模板 09: 协同仿真 —— 在线步进双向同步模式 (Online Step) (SC-7)
# 
# 模板定位:
# - 基于 SSP/FMI 工业标准协议，全厂宏观系统模型与高保真子系统处理器的在线单步双向数据交互原型
# 
# 核心特征 / 占位符契约:
# - 协同模式: task.type = "cosim", mode = "online_step"
# - 核心机理: Lockstep Dynamic Exchange (双向锁步动态同步)，每步推进前交换进出口流量与组分
# - 自省替换: ${MODEL_SSP_PATH}, ${MODEL_NAME}, ${STORAGE_NODE}, ${EXCHANGE_STEP_SIZE}, ${TARGET_SUBMODEL}, ${INSTANCE_NAME}, ${ONLINE_SOLVER}, ${HANDLER_MODULE_PATH}, ${HANDLER_CLASS_NAME}
# - 鲁棒控制: 内置局部质量控制 (local_mass_control) 与影子 FMU 降级回退 (shadow_fmu_fallback)
# - 交付报告: 聚变堆多物理场协同仿真评估报告 (在线步进模式) (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "${MODEL_SSP_PATH}"                         # 例如: example_model.ssp
  modelName: "${MODEL_NAME}"

scenario:
  startTime: 0.0
  stopTime: ${STOP_TIME}
  stepSize: ${EXCHANGE_STEP_SIZE}                       # 宏观数据交换通信步长
  method: "dassl"
  variableFilter: "time|${STORAGE_NODE}|.*\\.I.*"

task:
  type: "cosim"
  mode: "online_step"
  subsystems:
    - target: "${TARGET_SUBMODEL}"                      # 例如: CFEDR.I_ISS
      instance: "${INSTANCE_NAME}"                     # 例如: i_iss
      solver: "${ONLINE_SOLVER}"                       # 例如: "aspen_plus", "fmu", "custom_step"
      handler_module: "${HANDLER_MODULE_PATH}"         # 在线步进处理器模块
      handler_function: "${HANDLER_CLASS_NAME}"
      params:
        ${ONLINE_SOLVER_PARAMS}
      local_mass_control:
        enabled: true
        deadband_g: 0.05
  metrics:
    peak_inventory:
      source: "${STORAGE_NODE}"
      evaluate: "peak_value"
    final_inventory:
      source: "${STORAGE_NODE}"
      evaluate: "final_value"

visualizer:
  enabled: true
  launch_on_finish: false
  report:
    enabled: true
    title: "TRICYS 聚变堆多物理场协同仿真评估报告 (在线步进模式)"
    formats: ["markdown", "docx", "pdf"]
