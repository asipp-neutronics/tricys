version: "2.0"

# ==============================================================================
# TRICYS V2.0 演示模板 12: 参数扫描内嵌双层优化 (Sweep with Embedded Nested Bisection) (SC-10)
# 
# 模板定位:
# - 复现 Abdou (2021) 经典工况扫描研究原型，自动化为各扫描工况求解最小自持启动装填量与 Required TBR
# 
# 核心特征 / 占位符契约:
# - 任务模式: task.type = "sweep"，外层多工况并行扫描，内嵌 task.optimization 双层寻优
# - 自省替换: ${MODEL_FILE_PATH}, ${MODEL_NAME}, ${STORAGE_NODE}, ${STORAGE_STARTUP_PARAM}, ${TBR_PARAM}, ${BURNUP_PARAM}
# - 优化指标: 对每个扫描工况自动化求解满足谷底储备 (I_min >= threshold) 与倍增时间 (t_d <= threshold) 的最优解对 (I_0*, Required_TBR*)
# - 汇总呈现: 将各工况优化解直接汇总入横向对比指标表并绘制多曲线图，自动生成完整工程分析报告 (Markdown / DOCX / PDF)
# ==============================================================================

model:
  fileName: "${MODEL_FILE_PATH}"
  modelName: "${MODEL_NAME}"

scenario:
  time_base: "second"
  stopTime: 2000.0
  stepSize: 0.5
  method: "dassl"
  variableFilter: "time|${STORAGE_NODE}|.*\\.I.*"

task:
  type: "sweep"
  parallel: true
  max_workers: 4
  parameters:
    - name: "Burnup_3pct_Conservative"
      ${BURNUP_PARAM}: 0.03
    - name: "Burnup_5pct_Baseline"
      ${BURNUP_PARAM}: 0.05
    - name: "Burnup_8pct_Advanced"
      ${BURNUP_PARAM}: 0.08

  # 在参数扫描任务 (sweep) 中内嵌 optimization 块：
  # 求解器将对每个扫描工况自动化执行双层嵌套寻优，将各工况的优化解作为汇总指标输出
  optimization:
    track: "track2_bisection"
    algorithm: "nested_bisection"
    outer:
      parameter: "${STORAGE_STARTUP_PARAM}"     # 初始装填量参数 (如 "sds.I_S_0")
      search_bounds: [1000.0, 5000.0]
      tolerance: 20.0
      max_iterations: 10
      target_metric:
        source: "${STORAGE_NODE}"               # 监测存量节点 (如 "sds.I[1]")
        evaluate: "min_value"
        threshold: 1000.0                       # 谷底安全红线 (g)
        comparator: ">="
    inner:
      metric_name: "Required_TBR"
      parameter: "${TBR_PARAM}"                 # 待寻优产氚比参数 (如 "blanket.TBR")
      search_bounds: [1.05, 1.25]
      tolerance: 0.005
      max_iterations: 10
      target_metric:
        source: "${STORAGE_NODE}"
        evaluate: "doubling_time"
        threshold: 2500.0                       # 可配置为单值标量 (如 2500.0) 或多值列表 (如 [2200.0, 2500.0])
        comparator: "<="

visualizer:
  enabled: true
  launch_on_finish: false
  report:
    enabled: true
    title: "TRICYS 多工况参数扫描内嵌双层优化工程分析报告 (Sweep with Nested Optimization)"
    formats: ["markdown", "docx", "pdf"]
