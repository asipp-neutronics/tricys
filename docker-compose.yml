# ==============================================================================
# TRICYS V2.0: Single-Container Unified Fullstack Docker Compose
# Runs the entire multi-physics simulation, FastAPI backend, Vue3 web console,
# GoView digital twin, and Dash/Plotly HDF5 visualizer in ONE container.
#
# Mounts:
#   - tricys (simulation engine & workflows): . -> /workspace/tricys
#   - tricys_backend (FastAPI services): ./tricys_backend -> /workspace/tricys_backend
#   - h2iso (cryogenic isotope distillation): ../h2iso -> /workspace/h2iso
#   - tricys_data (persistent database & files): -> /data
#
# Usage:
#   docker compose up -d --build
# ==============================================================================

services:
  tricys:
    image: ${TRICYS_IMAGE:-ghcr.io/asipp-neutronics/tricys:latest}
    build:
      context: .
      dockerfile: ./docker/dockerfiles/Dockerfile
    container_name: tricys_allinone
    init: true
    restart: unless-stopped
    ports:
      - "${TRICYS_PORT:-8080}:80"            # Web Console & Gateway (/ , /api/ , /goview/ , /hdf5/)
      - "${TRICYS_BACKEND_PORT:-8000}:8000"  # FastAPI Backend & Swagger Docs (/docs)
      - "${TRICYS_GOVIEW_PORT:-3020}:3020"   # GoView Digital Twin Screen
      - "${TRICYS_HDF5_PORT:-8050}:8050"     # Dash/Plotly HDF5 Visualizer
    environment:
      DISPLAY: ":0"
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir}
      PULSE_SERVER: ${PULSE_SERVER:-/mnt/wslg/PulseServer}
      QT_X11_NO_MITSHM: "1"
      LANG: "zh_CN.UTF-8"
      LC_ALL: "zh_CN.UTF-8"
      LANGUAGE: "zh_CN:zh"
      DATABASE_URL: ${TRICYS_DATABASE_URL:-sqlite:////data/tricys.db}
      WORKSPACES_DIR: ${TRICYS_WORKSPACES_DIR:-/data/workspaces}
      ASSETS_DIR: ${TRICYS_ASSETS_DIR:-/data/assets}
      HDF5_CONTEXTS_DIR: ${TRICYS_HDF5_CONTEXTS_DIR:-/data/hdf5_contexts}
      HDF5_VISUALIZER_HEALTHCHECK_URL: http://127.0.0.1:8050/hdf5/health
      HDF5_VISUALIZER_BASE_URL: ${TRICYS_HDF5_VISUALIZER_BASE_URL:-/hdf5/}
      HDF5_VISUALIZER_SECRET: ${TRICYS_HDF5_VISUALIZER_SECRET:-change-me-before-production}
      SECRET_KEY: ${TRICYS_SECRET_KEY:-change-me-before-production}
      CORS_ORIGINS: ${TRICYS_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3020,http://127.0.0.1:3020,http://localhost:5173,http://127.0.0.1:5173,null,*}
    volumes:
      - .:/workspace/tricys
      - ${TRICYS_BACKEND_PATH:-./tricys_backend}:/workspace/tricys_backend
      - ${H2ISO_PATH:-../h2iso}:/workspace/h2iso:ro
      # Universal GUI Bridge: automatically detects Linux (/tmp/.X11-unix) or Windows 11 (/run/desktop/mnt/host/wslg)
      - /tmp/.X11-unix:/tmp/.X11-unix-host:ro
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix-wslg:ro
      - /run/desktop/mnt/host/wslg:/mnt/wslg:ro
    command: ["all-in-one"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health && curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  tricys_data:
