# ==============================================================================
# TRICYS V2.0: Single-Container All-in-One Nginx Configuration
# Hosts:
#   1. Port 80:
#      - Vue3 Web Console (root /)
#      - Reverse proxy /api/ -> 127.0.0.1:8000 (FastAPI Backend)
#      - Reverse proxy /hdf5/ -> 127.0.0.1:8050 (Dash HDF5 Visualizer)
#      - GoView subpath /goview/ -> /opt/tricys-web/goview
#      - Backend assets /assets/ and /static/
#   2. Port 3020:
#      - GoView Digital Twin Screen (root /)
#      - Reverse proxy /api/ -> 127.0.0.1:8000
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ------------------------------------------------------------------------------
# 1. Main Web Console & Gateway (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /opt/tricys-web/visual;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # API Proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # GoView Big Screen hosted inside same Nginx
    location /goview/ {
        alias /opt/tricys-web/goview/;
        index index.html;
        try_files $uri $uri/ /goview/index.html;
    }

    location = /goview {
        return 308 /goview/;
    }

    # HDF5 Interactive Visualizer
    location /hdf5/ {
        client_max_body_size 32m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8050;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# ------------------------------------------------------------------------------
# 2. GoView Standalone Virtual Host (Port 3020)
# ------------------------------------------------------------------------------
server {
    listen 3020;
    server_name _;

    root /opt/tricys-web/goview;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
